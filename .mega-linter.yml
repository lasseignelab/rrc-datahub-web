# Configuration file for MegaLinter
#
# See all available variables at https://megalinter.io/latest/config-file/ and in
# linters documentation

# all, none, or list of linter keys
APPLY_FIXES: none

# If you use ENABLE variable, all other languages/formats/tooling-formats will
# be disabled by default
ENABLE:
  - PYTHON

# If you use ENABLE_LINTERS variable, all other linters will be disabled by
# default
# ENABLE_LINTERS:

# DISABLE:
  # - COPYPASTE # Uncomment to disable checks of excessive copy-pastes
  # - SPELL # Uncomment to disable checks of spelling mistakes

SHOW_ELAPSED_TIME: true

FILEIO_REPORTER: false

# Uncomment if you want MegaLinter to detect errors but not block CI to pass
# DISABLE_ERRORS: true

PYTHON_BANDIT_FILTER_REGEX_EXCLUDE: "tests/"

# isort does not reliably pick up pyproject.toml inside Docker; pass settings explicitly
PYTHON_ISORT_ARGUMENTS: "--profile black -p app -p components -p config -p db -p pages"

# Third-party packages are not installed in the MegaLinter Docker image, so
# pylint cannot resolve them. Suppress E0401 globally; import resolution is
# verified at runtime and in CI where packages are installed.
PYTHON_PYLINT_ARGUMENTS: "--disable=import-error"

# Suppress mypy's missing-stubs warning; stub packages are not installed in
# the MegaLinter Docker image. Type coverage is verified locally where packages
# are installed.
PYTHON_MYPY_ARGUMENTS: "--disable-error-code=import-untyped"

# PRE_COMMANDS:
#   - command: pip install -r requirements.txt
#     cwd: workspace
#   - command: pip install -r requirements-dev.txt
#     cwd: workspace
